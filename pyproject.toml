[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-pymunk"
version = "0.1.0"
description = "Pymunk-compatible 2D rigid-body primitives backed by Mojo"
requires-python = ">=3.10"
dependencies = ["numpy"]
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
